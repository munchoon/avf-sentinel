[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avf-sentinel"
version = "0.1.0"
description = "Research prototype for multimodal AV-fistula thrombosis/stenosis triage"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AVF Sentinel hackathon team" }]
keywords = ["dialysis", "arteriovenous fistula", "multimodal", "triage", "research"]
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "opencv-python>=4.9",
  "Pillow>=10.0",
  "matplotlib>=3.8",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
clip = ["open_clip_torch>=2.24"]

[project.scripts]
avf-synth = "avfsentinel.synth:main"
avf-prepare = "avfsentinel.prepare:main"
avf-train = "avfsentinel.train:main"
avf-infer = "avfsentinel.infer:main"
avf-serve = "avfsentinel.serve:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
